<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Menu lateral</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Menu principal" style="position: sticky; top: 0; width: 248px; height: 100vh; min-height: 640px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; padding: 28px 20px 20px; background: #FFFFFF; border-right: 1px solid #EDE4D3; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #142028">
<a href="Painel.dc.html" aria-label="JáNaCaixa, ir para o Painel" style="text-decoration: none; color: #142028; font-family: 'Baloo 2', 'Plus Jakarta Sans', sans-serif; font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -0.5px; padding: 0 8px"><span style="color: #157A2E">Já</span>NaCaixa</a>
<button type="button" onClick="{{nova}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border: 0; border-radius: 12px; background: #157A2E; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
<span>Nova transação</span>
</button>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{itens}}" as="item" hint-placeholder-count="3">
<li>
<a href="{{item.href}}" aria-current="{{item.atual}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: {{item.peso}}; color: {{item.cor}}; background: {{item.fundo}}">
<span aria-hidden="true" style="display: flex; width: 20px; height: 20px">
<sc-if value="{{item.isPainel}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="10" rx="2"></rect><rect x="13" y="3" width="8" height="6" rx="2"></rect><rect x="13" y="11" width="8" height="10" rx="2"></rect><rect x="3" y="15" width="8" height="6" rx="2"></rect></svg></sc-if>
<sc-if value="{{item.isTransacoes}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 20l-3-3M7 20l3-3"></path><path d="M17 20V4M17 4l-3 3M17 4l3 3"></path></svg></sc-if>
<sc-if value="{{item.isCategorias}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"></path><circle cx="8" cy="8" r="1.5"></circle></svg></sc-if>
</span>
<span>{{item.rotulo}}</span>
</a>
</li>
</sc-for>
</ul>
<div style="flex: 1"></div>
<div style="position: relative; padding-top: 40px">
<img src="../../assets/mascote/papo-espiando.png" alt="" aria-hidden="true" style="position: absolute; left: 50%; top: 2px; width: 128px; height: auto; transform: translateX(-50%); z-index: 0">
<div style="position: relative; z-index: 1; display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #EDE4D3; box-shadow: 0 6px 18px rgba(20, 32, 40, 0.06)">
<div style="display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="flex: none; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: #E6F2E9; color: #145C26; font-size: 13px; font-weight: 800">GS</span>
<span style="display: flex; flex-direction: column; min-width: 0">
<strong style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Guilherme S.</strong>
<span style="font-size: 12px; font-weight: 500; color: #4A5862">guilherme.s</span>
</span>
</div>
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-radius: 10px; border: 1.5px solid #D5DCE0; color: #142028; text-decoration: none; font-size: 14px; font-weight: 600">
<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
<span>Sair</span>
</a>
</div>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ativo":{"editor":"enum","options":["painel","transacoes","categorias"],"default":"painel"},"onNova":{"editor":null},"$preview":{"width":248,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const ativo = this.props.ativo ?? 'painel';
    const base = [
      { id: 'painel', rotulo: 'Painel', href: 'Painel.dc.html' },
      { id: 'transacoes', rotulo: 'Transações', href: 'Transacoes.dc.html' },
      { id: 'categorias', rotulo: 'Categorias', href: 'Categorias.dc.html' }
    ];
    const itens = base.map((i) => {
      const on = i.id === ativo;
      return {
        ...i,
        atual: on ? 'page' : undefined,
        peso: on ? '700' : '500',
        cor: on ? '#145C26' : '#2B3A44',
        fundo: on ? '#E6F2E9' : 'transparent',
        isPainel: i.id === 'painel',
        isTransacoes: i.id === 'transacoes',
        isCategorias: i.id === 'categorias'
      };
    });
    return {
      itens,
      nova: () => { if (this.props.onNova) this.props.onNova(); }
    };
  }
}
</script>
</body>
</html>
