<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cena mobile — céu, mar e Papo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 100%; height: {{altura}}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #142028">
<svg viewBox="0 0 375 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block">
<defs>
<path id="nuvem-m" d="M30 80 C 8 80 0 58 16 46 C 12 24 38 12 58 22 C 66 4 102 -2 118 18 C 132 8 160 12 162 36 C 186 34 200 56 186 72 C 182 78 176 80 168 80 Z"></path>
</defs>
<path d="M-200 -200 H 575 V 248 C 450 238 300 254 187 248 C 80 242 0 252 -200 246 Z" fill="#CDEFFC"></path>
<rect x="-200" y="110" width="775" height="42" fill="#DDF4FD"></rect>
<circle cx="330" cy="50" r="28" fill="#FFE9A0" fill-opacity="0.45"></circle>
<circle cx="330" cy="50" r="18" fill="#FFE27A"></circle>
<use href="#nuvem-m" transform="translate(150 22) scale(0.5)" fill="#FFFFFF" stroke="#EEF9FE" stroke-width="2"></use>
<use href="#nuvem-m" transform="translate(4 104) scale(0.36)" fill="#FFFFFF" fill-opacity="0.9"></use>
<path d="M-200 152 H 0 Q 25 148 50 152 T 100 152 T 150 152 T 200 152 T 250 152 T 300 152 T 350 152 T 400 152 H 575 V 260 H -200 Z" fill="#6CC6EA"></path>
<path d="M-200 186 H 0 Q 35 181 70 186 T 140 186 T 210 186 T 280 186 T 350 186 T 420 186 H 575 V 260 H -200 Z" fill="#2EA3D6"></path>
<path d="M-200 214 H 0 Q 45 208 90 214 T 180 214 T 270 214 T 360 214 T 450 214 H 575 V 260 H -200 Z" fill="#0E7FB4"></path>
<path d="M-200 236 H 0 C 110 228 250 244 375 232 H 575 V 252 H -200 Z" fill="#7CCBEB"></path>
<path d="M-200 242 H 0 C 110 234 250 250 375 238 H 575 V 247 C 450 244 300 254 187 248 C 80 242 0 252 -200 246 Z" fill="#FFFFFF" fill-opacity="0.8"></path>
</svg>
<div style="position: absolute; left: {{mascoteX}}; bottom: 3%; height: 72%; aspect-ratio: {{proporcao}}; transform: translateX(-50%)">
<div aria-hidden="true" style="position: absolute; left: 10%; right: 10%; bottom: -3%; height: 7%; border-radius: 50%; background: rgba(120, 90, 40, 0.18)"></div>
<img src="{{src}}" alt="{{alt}}" style="position: relative; display: block; width: 100%; height: 100%; object-fit: contain">
<sc-if value="{{mostrarFala}}" hint-placeholder-val="{{ true }}">
<div role="status" style="position: absolute; left: 82%; top: 0; width: max-content; max-width: 148px; padding: 8px 12px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 6px 18px rgba(20, 32, 40, 0.16); font-size: 14px; font-weight: 700; line-height: 1.3; color: #142028">
<div aria-hidden="true" style="position: absolute; left: -5px; top: 14px; width: 12px; height: 12px; background: #FFFFFF; transform: rotate(45deg); border-radius: 2px"></div>
<span style="position: relative">{{fala}}</span>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pose":{"editor":"enum","options":["login","carregando","erro","sucesso"],"default":"login"},"fala":{"editor":null,"default":"Bom dia! O mar tá calmo, pode entrar."},"altura":{"editor":null,"default":"300px"},"mascoteX":{"editor":null,"default":"36%"},"$preview":{"width":375,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    const poses = {
      login: { src: '../../assets/mascote/papo-cadeira-acenando.png', r: '608 / 576', alt: 'Papo, o jacaré mascote, relaxando numa cadeira de praia ao lado de um baú de moedas, acenando' },
      carregando: { src: '../../assets/mascote/papo-animado.png', r: '511 / 570', alt: 'Papo animado, de punhos fechados, esperando' },
      erro: { src: '../../assets/mascote/papo-preocupado.png', r: '491 / 618', alt: 'Papo preocupado, coçando a cabeça com uma gota de suor' },
      sucesso: { src: '../../assets/mascote/papo-joinha.png', r: '513 / 617', alt: 'Papo piscando e fazendo joinha' }
    };
    const p = poses[this.props.pose] || poses.login;
    const fala = this.props.fala ?? 'Bom dia! O mar tá calmo, pode entrar.';
    return {
      src: p.src,
      alt: p.alt,
      proporcao: p.r,
      fala,
      mostrarFala: !!fala,
      altura: this.props.altura ?? '300px',
      mascoteX: this.props.mascoteX ?? '36%'
    };
  }
}
</script>
</body>
</html>
